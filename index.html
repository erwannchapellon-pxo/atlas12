function exerciseCard(p,ex,idx){let expanded=ui.expanded===ex.id;let prev=getPriorExercise(ex.id,ui.sessionDate);const s=existingSession(ui.sessionDate,p.id),a=s.sets?.[ex.id]||[];const checked=a.filter(x=>x.done).length;const sets=effectiveSets(ex,ui.sessionDate);return `<article class="card workout-card"><button class="exercise-head" onclick="toggleEx('${ex.id}')" aria-expanded="${expanded}"><span class="exercise-index">${String(idx+1).padStart(2,'0')}</span><img class="exercise-thumbnail" loading="lazy" src="${imagePath(ex.id,0)}" alt=""><span class="titlewrap"><div class="ex-name">${safe(ex.name)}</div><div class="ex-sub">${sets} × ${safe(ex.reps)} · RIR ${ex.rir} · repos ${Math.round(ex.rest/60*10)/10} min</div></span><span class="tag">${checked}/${sets}</span><span class="chev">›</span></button>${expanded?`<div class="exercise-content">${techniqueMedia(ex)}<div class="callout">${safe(ex.tip)}<div style="margin-top:5px"><b>Alternative :</b> ${safe(ex.alt)}</div></div><div class="sethead"><span>#</span><span>Charge (kg)</span><span>Rép.</span><span>RIR</span><span>OK</span></div>${Array.from({length:sets},(_,i)=>{const set=setObjectFor(p.id,ex,i);return `<div class="setrow ${set.done?'completed':''}"><span class="set-number">${i+1}</span><input type="number" step="0.5" min="0" inputmode="decimal" value="${safe(set.weight)}" placeholder="kg" aria-label="Charge série ${i+1}" data-setfield="weight" data-ex="${ex.id}" data-index="${i}"><input type="number" min="0" max="100" inputmode="numeric" placeholder="rép." value="${safe(set.reps)}" aria-label="Répétitions série ${i+1}" data-setfield="reps" data-ex="${ex.id}" data-index="${i}"><input type="number" min="0" max="10" inputmode="numeric" value="${safe(set.rir)}" aria-label="RIR série ${i+1}" data-setfield="rir" data-ex="${ex.id}" data-index="${i}"><button class="set-done ${set.done?'done':''}" onclick="toggleSet('${ex.id}',${i})" aria-label="Valider série ${i+1}">${set.done?'✓':'○'}</button></div>`}).join('')}<div function persistSetField(input){const exId=input.dataset.ex,i=Number(input.dataset.index),field=input.dataset.setfield;if(!exId||!['weight','reps','rir'].includes(field))return;const sKey=sessionKey(ui.sessionDate,ui.day);const s=data.sessions[sKey]||{sets:{}};s.sets=s.sets||{};let ex=PROGRAM.find(x=>x.id===ui.day).ex.find(x=>x.id===exId);s.sets[exId]=s.sets[exId]||[];s.sets[exId][i]=s.sets[exId][i]||setObjectFor(ui.day,ex,i);s.sets[exId][i]={...s.sets[exId][i],[field]:input.value};data.sessions[sKey]=s;save()}
function toggleSet(exId,i){let ex=PROGRAM.find(x=>x.id===ui.day).ex.find(x=>x.id===exId),sKey=sessionKey(ui.sessionDate,ui.day);let s=data.sessions[sKey]||{sets:{}};s.sets=s.sets||{};s.sets[exId]=s.sets[exId]||[];let set=s.sets[exId][i]||setObjectFor(ui.day,ex,i);if(!set.done && (set.weight===''||set.weight==null||set.reps===''||set.reps==null||number(set.reps)<=0||number(set.weight)<0)){toast('Renseigne la charge et les répétitions');return}s.sets[exId][i]={...set,done:!set.done};data.sessions[sKey]=s;save();render();if(!set.done){toast('Série enregistrée ✓');startTimer(ex.rest,false)}}

function timerText(){let sec=Math.max(0,Math.ceil((ui.timerEnd-Date.now())/1000));return pad(Math.floor(sec/60))+':'+pad(sec%60)};function startTimer(sec,notify=true){ui.timerEnd=Date.now()+sec*1000;tickTimer();if(notify)toast('Minuteur lancé : '+sec+' sec')};function stopTimer(){ui.timerEnd=0;tickTimer()};function tickTimer(){let el=document.querySelector('#timerClock');if(el)el.textContent=ui.timerEnd?timerText():'—:—';if(ui.timerEnd&&Date.now()>=ui.timerEnd){ui.timerEnd=0;if(navigator.vibrate)navigator.vibrate([120,90,120]);toast('Repos terminé, prêt pour la suite !')}}setInterval(tickTimer,1000);

function svgChart(field,unit){const all=Object.entries(data.measurements).filter(([d,v])=>v&&v[field]!==''&&v[field]!=null&&Number.isFinite(number(v[field]))).sort((a,b)=>a[0].localeCompare(b[0])).slice(-18);if(all.length===0)return '<div class="empty">Pas encore de mesures. Ajoute une première valeur ci-dessous pour afficher ta courbe.</div>';const vals=all.map(x=>number(x[1][field]));let min=Math.min(...vals),max=Math.max(...vals);if(Math.abs(max-min)<.1){min-=1;max+=1}else{const pad=(max-min)*.2;min-=pad;max+=pad}const W=330,H=152,L=22,R=12,T=12,B=24;let xx=i=>L+(W-L-R)*(all.length===1?.5:i/(all.length-1));let yy=v=>T+(H-T-B)*(1-(v-min)/(max-min));const line=all.map((x,i)=>`${i?'L':'M'} ${xx(i).toFixed(1)} ${yy(vals[i]).toFixed(1)}`).join(' ');const area=line+` L ${xx(all.length-1).toFixed(1)} ${H-B} L ${xx(0).toFixed(1)} ${H-B} Z`;let labels=[0,1,2].map(i=>{let v=min+(max-min)*i/2,y=yy(v);return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#304455" stroke-dasharray="3 4"/><text x="0" y="${y+4}" fill="#91a5b6" font-size="9">${fmt(v,1)}</text>`}).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe ${safe(field)}, de ${safe(shortDate(all[0][0]))} à ${safe(shortDate(all.at(-1)[0]))}"><defs><linearGradient id="chart-grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#c2f477" stop-opacity=".22"/><stop offset="100%" stop-color="#c2f477" stop-opacity="0"/></linearGradient></defs>${labels}<path d="${area}" fill="url(#chart-grad)"/><path d="${line}" fill="none" stroke="#c2f477" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>${all.map((x,i)=>`<circle cx="${xx(i)}" cy="${yy(vals[i])}" r="${i===all.length-1?4:2.2}" fill="${i===all.length-1?'#dfffaa':'#c2f477'}"/>`).join('')}<text x="${L}" y="${H-5}" font-size="10" fill="#95aabc">${shortDate(all[0][0])}</text><text x="${W-R}" text-anchor="end" y="${H-5}" font-size="10" fill="#95aabc">${shortDate(all.at(-1)[0])}</text></svg></div><div class="metric-row small muted"><span>${all.length} mesure(s)</span><span>Dernière : <b class="green">${fmt(vals.at(-1),1)} ${unit}</b></span></div>`}

  <div class="space"></div><div class="card">${cardHeader('Historique',`<span class="pill">${Object.keys(data.measurements).length} jours</span>`)}${entries.length?`<div class="table-scroll" style="margin-top:9px"><table class="data-table"><thead><tr><th>Date</th><th>Poids</th><th>Taille</th><th>Pas</th><th></th></tr></thead><tbody>${entries.map(([d,r])=>`<tr><td>${safe(shortDate(d))}</td><td>${r.weight!==undefined?fmt(r.weight,1)+' kg':'—'}</td><td>${r.waist!==undefined?fmt(r.waist,1)+' cm':'—'}</td><td>${r.steps!==undefined?fmt(r.steps):'—'}</td><td><button class="link-button" onclick="editMetric('${d}')">Éditer</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ton historique apparaîtra ici.</div>'}</div>`}
function saveMetrics(){if(!ui.metricDate){toast('Choisis une date');return}const obj={};let invalid=false;document.querySelectorAll('[data-metric]').forEach(input=>{const v=input.value.trim();if(!v)return;const n=number(v);if(n===null||n<0||(input.dataset.metric==='energy'&&(n<1||n>5))){invalid=true;return}obj[input.dataset.metric]=n});if(invalid){toast('Vérifie les valeurs saisies');return}data.measurements[ui.metricDate]={...data.measurements[ui.metricDate],...obj};save();toast('Mesures enregistrées ✓');render()};function editMetric(d){ui.metricDate=d;render();document.querySelector('#metricDate')?.scrollIntoView({behavior:'smooth',block:'center'})}
function showWellbeing(){const d=localDate(),h=data.habits[d]||{};const habits=[['sleep','Respecter une heure de coucher régulière'],['walk','Faire 2 petites marches'],['mobility','5–8 minutes de mobilité ou détente'],['hydration','Boire régulièrement dans la journée'],['screen','Réduire les écrans avant de dormir']];let done=habits.filter(([k])=>h[k]).length;const s=latest('sleep'),e=latest('energy');return `<div class="eyebrow">RECOVERY / WELLNESS</div><h2 class="h2" style="font-size:25px">L’énergie avant tout.</h2><p class="small muted">Ton sommeil historique de 6–7 h et ton énergie faible justifient de privilégier une progression tolérable plutôt que le volume maximal.</p><div class="grid2"><div class="card mini-stat"><div class="muted tiny">SOMMEIL VISÉ</div><b>${fmt(data.settings.sleep,1)} h</b><span class="hint">${s?'Dernier : '+fmt(s.value,1)+' h':'Progression par +15 à 30 min'}</span></div><div class="card mini-stat"><div class="muted tiny">ÉNERGIE NOTÉE</div><b>${e?fmt(e.value)+'/5':'—'}</b><span class="hint">${e?'Dernier bilan : '+shortDate(e.date):'À renseigner dans Suivi'}</span></div></div><div class="space"></div><div class="card">${cardHeader('Rituels du jour',`<span class="pill">${done}/${habits.length}</span>`)}<div style="height:12px"></div><div class="bar"><div style="width:${done/habits.length*100}%"></div></div><div style="height:10px"></div>${habits.map(([key,label])=>`<label class="checkline"><input type="checkbox" ${h[key]?'checked':''} onchange="toggleHabit('${key}',this.checked)"><span class="small">${label}</span></label>`).join('')}<div class="caption" style="margin-top:10px">Ce sont des habitudes à encourager, pas des obligations à cocher parfaitement chaque jour.</div></div><div class="space"></div><div class="card accordion">${[
 ['Sommeil & stress','Vise une heure de lever stable, une exposition à la lumière naturelle le matin et une consommation de caféine suffisamment éloignée du coucher. Le cortisol varie normalement au cours de la journée : chercher à le supprimer n’a aucun sens.'],
 ['Fatigue & récupération','Si la fatigue persiste plusieurs semaines malgré un meilleur sommeil et une charge raisonnable, demande un avis médical. Des ronflements importants et une somnolence diurne peuvent notamment justifier l’exploration du sommeil.'],
 ['Ballonnements (« debloat »)','Différencie les gaz digestifs, la graisse corporelle et les fluctuations d’eau. Mange moins vite, répartis progressivement les fibres et identifie les déclencheurs. Évite les cures de déshydratation et les diurétiques.'],
 ['Inflammation','L’exercice régulier, les végétaux, les aliments riches en fibres, les lipides insaturés et le sommeil soutiennent la santé métabolique. L’inflammation aiguë associée à l’effort est aussi une réponse normale.'],
 ['Street workout facile','Samedi si tu es bien récupéré : 2 × 8–15 pompes, 2 × 12–15 squats au poids du corps, 2 × 8 dead bugs de chaque côté, 2 × 20–30 s de planche latérale. Garde 2–3 répétitions de réserve.'],
 ['Mobilité express','Deux à trois fois par semaine : rotations thoraciques, contrôle des omoplates, mobilité des chevilles et ouverture des hanches, pendant 5–8 min. Évite les exercices douloureux.'],
 ['Compléments','Créatine monohydrate : 3–5 g/j chez l’adulte en bonne santé ; whey uniquement si utile pour atteindre les protéines. Vitamine D et autres suppléments selon situation. Pas de « bloqueurs de cortisol » ni de brûleurs de graisse.']
 ].map(([k,v])=>`<details><summary>${safe(k)}</summary><div class="inside">${safe(v)}</div></details>`).join('')}</div>`}
function toggleHabit(id,checked){const d=localDate();data.habits[d]=data.habits[d]||{};data.habits[d][id]=checked;save();render()}
function showPlan(){let w=weekNum();return `<div class="eyebrow">ROADMAP / 12 SEMAINES</div><h2 class="h2" style="font-size:25px">Progression intelligente.</h2><p class="small muted">Du ${shortDate(data.settings.start)} au ${shortDate(addDays(data.settings.start,83))}. Le volume de travail évolue par phase ; ajuste-le si ta récupération est insuffisante.</p><section class="card">${PHASES.map(([range,name,desc])=>`<div class="phase ${phaseMatch(range,w)?'current':''}"><b>S. ${safe(range)}</b><div class="pbody"><strong>${safe(name)} ${phaseMatch(range,w)?' · en cours':''}</strong>${safe(desc)}</div></div>`).join('')}</section><div class="space"></div><section class="card accordion">${[
 ['Volume d’entraînement','Pectoraux 10 séries directes/semaine, dos 10, quadriceps 12, ischios 9, deltoïdes latéraux 7, mollets 6. Les exercices de poussée et tirage travaillent aussi les bras.'],
 ['Double progression','Quand tu atteins toutes les séries en haut de la plage de répétitions avec une exécution propre et le RIR demandé, augmente la charge au prochain entraînement (souvent ~2,5–5 % sur les gros mouvements).'],
 ['Cardio et pas','S1–2 : 20–30 min faciles deux fois/semaine ; 5–5,5k pas. S3–4 : 25–35 min ; 6k pas. S5–7 : 30–40 min ; 6,5–7,5k pas. S8 : allègement. S9–12 : 35–45 min ; 8–9k pas, selon tolérance.'],
 ['Signaux de surcharge','Performances en baisse sur plusieurs séances, fatigue persistante, sommeil qui empire, douleurs inhabituelles : réduire le volume et réévaluer. Ne force pas en cas de douleur aiguë.'],
 ['Recomposition ≠ sèche agressive','La cible 2 850 kcal est provisoire. Base la décision sur 2–3 semaines de poids moyen, tour de taille, performances et énergie.']
 ].map(([k,v])=>`<details><summary>${safe(k)}</summary><div class="inside">${safe(v)}</div></details>`).join('')}</section>`}
function phaseMatch(s,w){let [a,b]=s.split('–').map(Number);return w>=a&&w<=(b||a)}
function showSettings(){const s=data.settings;return `<div class="eyebrow">PERSONNALISATION</div><h2 class="h2" style="font-size:25px">Tes paramètres.</h2><div class="card"><div class="inputgrid">${[['start','Début du cycle','date','1'],['baseline','Poids de départ (kg)','number','0.1'],['height','Taille (cm)','number','1'],['calories','Calories / jour','number','1'],['protein','Protéines (g)','number','1'],['fat','Lipides (g)','number','1'],['steps','Pas cibles / jour','number','1'],['sleep','Sommeil cible (h)','number','0.1']].map(([k,l,t,step])=>`<div class="field"><label for="setting-${k}">${l}</label><input data-setting="${k}" id="setting-${k}" type="${t}" ${t==='number'?`step="${step}" inputmode="decimal"`:''} value="${safe(s[k])}"></div>`).join('')}</div><div class="space"></div><button class="btn full" onclick="saveSettings()">${icon('check')} Enregistrer les préférences</button><p class="caption">Les glucides se recalculent automatiquement : (kcal − protéines × 4 − lipides × 9) ÷ 4.</p></div><div class="space"></div><section class="card"><h2 class="h2">Sauvegarde & confidentialité</h2><p class="small muted">Les mesures et séries sont sauvegardées localement et tes photos sont conservées dans IndexedDB. Les exports JSON incluent également les photos. Elles ne sont pas envoyées à un serveur. Sans compte, il n’y a pas de synchronisation entre tes appareils ou navigateurs.</p><div class="stack"><button class="btn ghost full" onclick="exportData()">↓ Exporter données + photos (.json)</button><button class="btn ghost full" onclick="document.querySelector('#importFile').click()">↑ Restaurer une sauvegarde (.json)</button><button class="btn danger full" onclick="resetData()">Réinitialiser toutes mes données</button></div><p class="caption">Conserve régulièrement une sauvegarde dans Fichiers ou iCloud Drive. La suppression des données de Safari peut effacer l’historique local.</p></section><div class="space"></div><div class="warning">Pour une installation fiable sur l’écran d’accueil et un fonctionnement hors ligne, utilise la version PWA hébergée sur une adresse HTTPS. Le simple fichier HTML ouvert depuis Fichiers peut avoir un stockage moins fiable selon le navigateur et le mode d’ouverture.</div>`}
function saveSettings(){const out={};let invalid=false;document.querySelectorAll('[data-setting]').forEach(inp=>{const k=inp.dataset.setting;if(k==='start'){if(!/^\d{4}-\d{2}-\d{2}$/.test(inp.value)){invalid=true;return}out[k]=inp.value}else{let v=number(inp.value);if(v===null||v<=0){invalid=true;return}out[k]=v}});if(invalid||out.calories<4*out.protein+9*out.fat){toast('Vérifie les valeurs des paramètres');return}data.settings={...data.settings,...out};save();toast('Paramètres sauvegardés ✓');render()}
async function exportData(){try{const pics=await allPhotos();let blob=new Blob([JSON.stringify({...data,exercisePhotos:pics,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='atlas12-sauvegarde-'+localDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Sauvegarde (avec photos) prête à enregistrer')}catch(e){toast('Export impossible : '+e.message)}}
function validateImport(v){if(!v||typeof v!=='object'||v.version!==1||!v.settings||!v.measurements||!v.sessions)return false;return true}
document.querySelector('#importFile').addEventListener('change',async event=>{const f=event.target.files?.[0];if(!f)return;try{if(f.size>30e6)throw Error('Fichier trop volumineux');const v=JSON.parse(await f.text());if(!validateImport(v))throw Error('Format de sauvegarde invalide');if(!confirm('Restaurer cette sauvegarde ? Les données locales actuelles seront remplacées.'))return;data={...clone(DEFAULT),...v,settings:{...DEFAULT.settings,...v.settings},measurements:v.measurements||{},sessions:v.sessions||{},habits:v.habits||{}};delete data.exercisePhotos;save();if(v.exercisePhotos&&typeof v.exercisePhotos==='object'){for(const [key,b64] of Object.entries(v.exercisePhotos)){if(/^[a-z0-9]+-(0|1)$/.test(key)&&typeof b64==='string')await photoPut(key,dataURLBlob(b64))}}toast('Sauvegarde et photos restaurées');render()}catch(e){alert('Import impossible : '+e.message)}finally{event.target.value=''}});
async function resetData(){if(confirm('Supprimer toutes les séries, mesures, photos et réglages sur cet appareil ?')&&confirm('Dernière confirmation : cette action est irréversible sans sauvegarde.')){data=clone(DEFAULT);save();try{const db=await photoDB();await new Promise(resolve=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();resolve()}})}catch(e){}toast('Données réinitialisées');render()}}
function goSettings(){ui.moreTab='settings';nav('more')}
function showMore(){const tabs=[['wellbeing','Bien-être'],['plan','12 semaines'],['settings','Réglages']];return `${title('COACH / OUTILS','Tout le reste.','Récupération, progression et paramètres personnalisés.')}
  <div class="tabs">${tabs.map(([id,l])=>`<button class="tab ${ui.moreTab===id?'active':''}" onclick="ui.moreTab='${id}';render()">${l}</button>`).join('')}</div><div class="space"></div>${ui.moreTab==='wellbeing'?showWellbeing():ui.moreTab==='plan'?showPlan():showSettings()}
  ${ui.moreTab==='plan'?`<div class="space"></div><section class="card accordion"><details><summary>Sources et prudence scientifique</summary><div class="inside">Principes : American College of Sports Medicine (musculation, 2026) ; International Society of Sports Nutrition (nutrition et composition corporelle) ; Organisation mondiale de la santé (activité physique) ; American Academy of Sleep Medicine (sommeil).<br><a target="_blank" rel="noopener" href="https://pubmed.ncbi.nlm.nih.gov/?term=ACSM+resistance+training+2026">Rechercher l’ACSM sur PubMed</a> · <a target="_blank" rel="noopener" href="https://www.who.int/news-room/fact-sheets/detail/physical-activity">OMS : activité physique</a> · <a target="_blank" rel="noopener" href="https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-Consumer/">NIH : suppléments</a>.<br>Ce programme n’est pas un dispositif médical ; tes résultats et ta tolérance individuelle priment sur les chiffres génériques.</div></details></section>`:''}
  <div class="footer-note">ATLAS / 12 · Version 1.2 · Atlas anatomique original · Sans compte ni abonnement</div>`}
function render(){renderNav();const html=ui.page==='home'?showHome():ui.page==='workouts'?showWorkouts():ui.page==='nutrition'?showNutrition():ui.page==='progress'?showProgress():showMore();document.querySelector('#app').innerHTML=`<header class="topbar"><div class="brand">ATLAS<span class="slash"> / </span>12<small>STRENGTH · HEALTH · FOCUS</small></div><div class="top-chip"><span class="live-dot"></span> TON ESPACE PRIVÉ</div></header><main id="main">${html}</main>`;tickTimer();if(ui.page==='workouts'&&ui.expanded)loadExercisePhotos(ui.expanded)}
// Save workout inputs immediately without replacing an active input or losing the iOS keyboard.
document.addEventListener('input',e=>{if(e.target?.matches('[data-setfield]'))persistSetField(e.target)});
// Avoid accidental loss of the first exercise when entering the training section.
ui.day=getTodaysMovement();ui.expanded=PROGRAM.find(w=>w.id===ui.day).ex[0].id;
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
